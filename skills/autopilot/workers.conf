# Hosts the loop on vaio launches jobs on, first one with room wins: ssh name, max busy sessions, min MemAvailable (MB),
# and the command vaio runs to wake it when asleep (- if it never sleeps). The wake command lives outside git on vaio.
# Each one needs the projects cloned and trusted there and gh logged in (`autopilot projects` checks).
mouse  3  3000  wake-mouse
vaio   2  2500  -
